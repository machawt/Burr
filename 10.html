<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>7 Word Flashcards</title>


<style>

/* =========================================================
   BASIC
   ========================================================= */

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background: #f4f6f8;
  color: #18212b;
}

.app {
  max-width: 520px;
  margin: auto;
  padding: 18px;
}

h1 {
  text-align: center;
  font-size: 1.5rem;
  margin: 4px 0 15px;
}


/* =========================================================
   PANEL
   ========================================================= */

.panel {
  background: white;
  border-radius: 18px;
  padding: 18px;
  box-shadow: 0 4px 18px #00000012;
}


/* =========================================================
   DAY BUTTONS
   ========================================================= */

.days {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
  margin-bottom: 18px;
}

.day {
  border: 0;
  border-radius: 12px;
  padding: 12px 3px;
  background: #e8edf2;
  font-weight: 700;
  cursor: pointer;
  font-size: .85rem;
}

.day:hover {
  background: #dce3e9;
}

.day.current {
  outline: 3px solid #5b7cfa;
}

.day.done {
  background: #bfe8c8;
}


/* =========================================================
   PROGRESS
   ========================================================= */

.meta {
  display: flex;
  justify-content: space-between;
  font-size: .95rem;
  color: #68727d;
}

.progress {
  height: 10px;
  background: #e8edf2;
  border-radius: 20px;
  overflow: hidden;
  margin-top: 10px;
}

.bar {
  height: 100%;
  width: 0%;
  background: #5b7cfa;
  transition: width .25s ease;
}


/* =========================================================
   FLASHCARD
   ========================================================= */

.card {
  background: white;
  border-radius: 18px;

  min-height: 330px;

  margin-top: 14px;
  padding: 20px;

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;

  text-align: center;

  box-shadow: 0 4px 18px #00000012;

  cursor: pointer;

  user-select: none;
}

.label {
  font-size: .8rem;
  color: #7b8794;

  margin-bottom: 14px;

  text-transform: uppercase;

  letter-spacing: .08em;
}

.word {
  font-size: 2.4rem;
  font-weight: 800;
  line-height: 1.2;
}

.answer {
  margin-top: 22px;
  font-size: 1.5rem;
  color: #3654b8;
}

.hint {
  margin-top: 28px;
  color: #7b8794;
}


/* =========================================================
   BUTTONS
   ========================================================= */

.controls {
  display: flex;
  gap: 10px;
  margin-top: 14px;
}

button.action {
  flex: 1;

  border: 0;
  border-radius: 14px;

  padding: 15px;

  font-size: 1rem;
  font-weight: 700;

  cursor: pointer;
}

.again {
  background: #ffd9d9;
}

.good {
  background: #ccefd5;
}

.again:hover {
  background: #ffcaca;
}

.good:hover {
  background: #b9e7c5;
}

button:disabled {
  opacity: .5;
  cursor: default;
}


/* =========================================================
   SUMMARY
   ========================================================= */

.summary {
  text-align: center;
  margin-top: 14px;

  color: #56616c;

  min-height: 24px;
}


/* =========================================================
   SAVED MESSAGE
   ========================================================= */

.saved {
  text-align: center;

  font-size: .8rem;

  color: #4d8a5b;

  margin-top: 5px;

  min-height: 18px;
}


/* =========================================================
   COMPLETE
   ========================================================= */

.complete-title {
  font-size: 2rem;
  font-weight: 800;
}


/* =========================================================
   RESET
   ========================================================= */

.reset-day {
  margin-top: 14px;

  width: 100%;

  background: white;

  color: #56616c;

  border: 1px solid #ccd3da !important;
}

.reset-day:hover {
  background: #f0f2f4;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 400px) {

  .app {
    padding: 12px;
  }

  .day {
    font-size: .75rem;
    padding: 10px 2px;
  }

  .word {
    font-size: 2rem;
  }

  .card {
    min-height: 300px;
  }

}

</style>

</head>


<body>


<div class="app">


<h1>7-Word Flashcards</h1>


<!-- =====================================================
     DAYS
     ===================================================== -->

<div class="panel">

  <div
    class="days"
    id="days">
  </div>


  <div class="meta">

    <span id="dayTitle">
      Day 1
    </span>

    <span id="count">
      0 / 7
    </span>

  </div>


  <div class="progress">

    <div
      class="bar"
      id="bar">
    </div>

  </div>

</div>


<!-- =====================================================
     CARD
     ===================================================== -->

<div
  class="card"
  id="card">


  <div
    class="label"
    id="label">

    English

  </div>


  <div
    class="word"
    id="word">
  </div>


  <div
    class="answer"
    id="answer">
  </div>


  <div
    class="hint"
    id="hint">

    Tap the card to reveal

  </div>


</div>


<!-- =====================================================
     CONTROLS
     ===================================================== -->

<div class="controls">


  <button
    class="action again"
    id="again">

    Again

  </button>


  <button
    class="action good"
    id="good">

    Got it ✓

  </button>


</div>


<!-- =====================================================
     SUMMARY
     ===================================================== -->

<div
  class="summary"
  id="summary">
</div>


<div
  class="saved"
  id="saved">
</div>


<!-- =====================================================
     RESET ONLY CURRENT DAY
     ===================================================== -->

<button
  class="action reset-day"
  id="resetDay">

  Reset This Day

</button>


</div>



<script>


/* =========================================================
   LESSONS
   ========================================================= */

const lessons = [

  /* DAY 1 */

  [
    ["sit down here", "raka ni"],
    ["come", "guwa"],
    ["paper", "jurra"],
    ["listen", "galiya"],
    ["listen you all", "buburr-galya apula"],
    ["yes", "ngaw"],
    ["no", "nika"]
  ],


  /* DAY 2 */

  [
    ["wait", "burdak"],
    ["where are you going", "nyinda ny-boya"],
    ["water", "bugula"],
    ["write", "wukurrjinga"],
    ["finished", "ganapiya"],
    ["correct/get", "ma"],
    ["me", "ngaypa"]
  ],


  /* DAY 3 */

  [
    ["bye", "bobo"],
    ["see", "na"],
    ["work", "jama"],
    ["matches", "bol"],
    ["home", "rrawa"],
    ["eat", "bay"],
    ["moon", "ran.gu"]
  ],


  /* DAY 4 */

  [
    ["sun", "marnnga"],
    ["star", "gata"],
    ["canoe", "lipalipa"],
    ["picture", "mun-mawunga"],
    ["smoke", "jolnga"],
    ["shelter", "belabila"],
    ["at night", "ana-munya"]
  ],


  /* DAY 5 */

  [
    ["tree/branch", "gun-jong"],
    ["skin", "malk"],
    ["shine", "jiny-jirra"],
    ["sleep", "a-yurra"],
    ["new (moon)", "rreyma"],
    ["above", "waykin"],
    ["bat", "galgu"]
  ],


  /* DAY 6 */

  [
    ["wife Ngarrich", "Beleny/Beleynjan"],
    ["daughter of Beleny", "Bangardijan"],
    ["grandaughter of Beleny", "Galijan"],
    ["mother of Beleny", "Gochan"],
    ["father of Beleny", "Gojok"],
    ["son of Beleny", "Bangardi"],
    ["Grandson of Beleny", "Gela"]
  ],


  /* DAY 7 */

  [
    ["sister in law Beleny", "Ngarrichan"],
    ["daughter of Ngarrichan", "Gamanyjan"],
    ["grandaughter of Ngarrichan", "Bulanyjan"],
    ["mother of Ngarrichan", "Wamutchan"],
    ["father of Ngarrichan", "Wamut"],
    ["son of Ngarrichan", "Gammarang"],
    ["Grandson of Ngarrichan", "Bulany"]
  ],


  /* DAY 8 */

  [
    ["Dua", "Jawunga"],
    ["Yirridjdja", "Yirrchinga"],
    ["Jawunga", "Balang,Gammarang,Gela,Wamut"],
    ["Yirrchinga", "Ngarrich,Bangardi,Bulany,Gojok"],
    ["man", "an-gugaliya"],
    ["kangaroo", "gornabola"],
    ["man spears wallaby", "an-gugaliya gornabola a-rrana"]
  ],


  /* DAY 9 */

  [
    ["1", "gun-ngardapa"],
    ["2", "awirri-jirrapa"],
    ["2 people and 1 wallaby", "awirri-jirrapa gugaliya yerrch rrapa gornabola an-ngardapa"],
    ["1 woman", "jin-ngardapa jin-gugaliya"],
    ["1 man", "an-ngardapa an-gugaliya"],
    ["people", "gugaliya yerrcha"],
    ["the woman lit the fire", "Jin-gugaliya bol ngana gu-wuna."]
  ],


  /* DAY 10 */

  [
    ["dilly bag", "burlapurr"],
    ["yam", "mun-banda"],
    ["the woman went for yams", "jin-gugaliya jiny-bona mun-banda"],
    ["children", "gu-ngarda yerrcha"],
    ["the children climbed the tree", "gu-ngarda yerrcha gu-jong aburr-warrchinga "],
    ["the woman dug out yams", "Jin-gugaliya mun-banda mu-yerrnjinga jinyu-ni"],
    ["children like yams", "Gu-ngarda yerrcha jol aburr-nirra mun-banda"]
  ]

];


/* =========================================================
   STORAGE
   ========================================================= */

const STORAGE_KEY =
  "sevenWordFlashcards_v4";


let saved =
  localStorage.getItem(STORAGE_KEY);


let state;


if (saved) {

  try {

    state = JSON.parse(saved);

  } catch (error) {

    state = null;

  }

}


if (
  !state ||
  !Array.isArray(state.days) ||
  state.days.length !== lessons.length
) {

  state = {

    currentDay: 0,

    days: Array(lessons.length).fill(null)

  };

}


let currentDay =
  Number(state.currentDay) || 0;


let revealed = false;


/* =========================================================
   SAVE
   ========================================================= */

function save() {

  state.currentDay = currentDay;

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(state)
  );

}


/* =========================================================
   SHUFFLE
   ========================================================= */

function shuffle(array) {

  const result = [...array];


  for (
    let i = result.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );


    [
      result[i],
      result[j]
    ] =
    [
      result[j],
      result[i]
    ];

  }


  return result;

}


/* =========================================================
   CREATE DAY
   ========================================================= */

function createDay(dayNumber) {

  /*
     Create the seven permanent cards.

     Each card has its own permanent
     correct score.
  */

  const cards =
    shuffle(
      lessons[dayNumber]
    ).map(
      (item, index) => {

        return {

          id: index,

          q: item[0],

          a: item[1],

          correct: 0

        };

      }
    );


  /*
     The queue contains the card IDs.

     The first ID is the card currently
     being shown.
  */

  const queue =
    cards.map(
      card => card.id
    );


  state.days[dayNumber] = {

    cards: cards,

    queue: queue

  };


  save();

}


/* =========================================================
   ENSURE DAY EXISTS
   ========================================================= */

function ensureDay(dayNumber) {

  const day =
    state.days[dayNumber];


  if (
    !day ||
    !Array.isArray(day.cards) ||
    day.cards.length !== 7 ||
    !Array.isArray(day.queue)
  ) {

    createDay(dayNumber);

  }

}


/* =========================================================
   CURRENT DAY
   ========================================================= */

function getDay() {

  ensureDay(currentDay);

  return state.days[currentDay];

}


/* =========================================================
   GET CARD BY ID
   ========================================================= */

function getCardById(id) {

  const day = getDay();

  return day.cards.find(
    card => card.id === id
  );

}


/* =========================================================
   CURRENT CARD
   ========================================================= */

function getCurrentCard() {

  const day = getDay();


  /*
     Remove completed cards from the queue
     if any are accidentally still present.
  */

  day.queue =
    day.queue.filter(
      id => {

        const card =
          day.cards.find(
            c => c.id === id
          );

        return (
          card &&
          card.correct < 3
        );

      }
    );


  if (day.queue.length === 0) {

    return null;

  }


  return getCardById(
    day.queue[0]
  );

}


/* =========================================================
   COUNT COMPLETED WORDS
   ========================================================= */

function completedCount() {

  const day = getDay();


  return day.cards.filter(
    card => card.correct >= 3
  ).length;

}


/* =========================================================
   DAY COMPLETE
   ========================================================= */

function isDayComplete() {

  const day = getDay();


  return (
    day.cards.length === 7 &&
    day.cards.every(
      card => card.correct >= 3
    )
  );

}


/* =========================================================
   RENDER DAYS
   ========================================================= */

function renderDays() {

  const container =
    document.getElementById("days");


  container.innerHTML = "";


  for (
    let i = 0;
    i < lessons.length;
    i++
  ) {

    const button =
      document.createElement("button");


    button.className = "day";


    if (i === currentDay) {

      button.classList.add(
        "current"
      );

    }


    if (
      state.days[i] &&
      state.days[i].cards &&
      state.days[i].cards.length === 7
    ) {

      const done =
        state.days[i].cards.every(
          card => card.correct >= 3
        );


      if (done) {

        button.classList.add(
          "done"
        );

        button.textContent =
          `✓ Day ${i + 1}`;

      } else {

        button.textContent =
          `Day ${i + 1}`;

      }

    } else {

      button.textContent =
        `Day ${i + 1}`;

    }


    /*
       Selecting a day changes only the
       selected day. It does not reset it.
    */

    button.onclick = function() {

      currentDay = i;

      ensureDay(currentDay);

      revealed = false;

      save();

      render();

    };


    container.appendChild(button);

  }

}


/* =========================================================
   RENDER
   ========================================================= */

function render() {

  ensureDay(currentDay);


  renderDays();


  const day =
    getDay();


  const done =
    completedCount();


  document.getElementById(
    "dayTitle"
  ).textContent =
    `Day ${currentDay + 1}`;


  document.getElementById(
    "count"
  ).textContent =
    `${done} / 7`;


  document.getElementById(
    "bar"
  ).style.width =
    `${(done / 7) * 100}%`;


  /* =====================================================
     COMPLETE
     ===================================================== */

  if (isDayComplete()) {

    document.getElementById(
      "label"
    ).textContent =
      "";


    document.getElementById(
      "word"
    ).textContent =
      "DAY COMPLETE! 🎉";


    document.getElementById(
      "word"
    ).className =
      "word complete-title";


    document.getElementById(
      "answer"
    ).textContent =
      "";


    document.getElementById(
      "hint"
    ).textContent =
      "All 7 words are 3/3 correct.";


    document.getElementById(
      "summary"
    ).textContent =
      "7 / 7 words complete";


    document.getElementById(
      "saved"
    ).textContent =
      "Progress saved";


    document.getElementById(
      "good"
    ).disabled = true;


    document.getElementById(
      "again"
    ).disabled = true;


    return;

  }


  /* =====================================================
     NORMAL CARD
     ===================================================== */

  document.getElementById(
    "good"
  ).disabled = false;


  document.getElementById(
    "again"
  ).disabled = false;


  const card =
    getCurrentCard();


  if (!card) {

    return;

  }


  document.getElementById(
    "label"
  ).textContent =
    "English";


  document.getElementById(
    "word"
  ).className =
    "word";


  document.getElementById(
    "word"
  ).textContent =
    card.q;


  document.getElementById(
    "answer"
  ).textContent =
    revealed
      ? card.a
      : "";


  document.getElementById(
    "hint"
  ).textContent =
    revealed
      ? "Choose Again or Got it"
      : "Tap the card to reveal";


  document.getElementById(
    "summary"
  ).textContent =
    `${done} / 7 words complete • ` +
    `This word: ${card.correct} / 3 correct`;


  document.getElementById(
    "saved"
  ).textContent =
    "Progress saved";

}


/* =========================================================
   REVEAL CARD
   ========================================================= */

document.getElementById(
  "card"
).onclick = function() {


  if (isDayComplete()) {

    return;

  }


  revealed =
    !revealed;


  render();

};


/* =========================================================
   GOT IT
   ========================================================= */

document.getElementById(
  "good"
).onclick = function(event) {

  /*
     Stop this click from also
     triggering the card.
  */

  event.stopPropagation();


  if (isDayComplete()) {

    return;

  }


  const day =
    getDay();


  /*
     Get the current card from the
     front of the queue.
  */

  const currentId =
    day.queue[0];


  const card =
    getCardById(currentId);


  if (!card) {

    return;

  }


  /*
     Increase the score by one.

     Maximum score is 3.
  */

  if (card.correct < 3) {

    card.correct =
      card.correct + 1;

  }


  /*
     Remove the current card
     from the front of the queue.
  */

  day.queue.shift();


  /*
     If the card is not yet 3/3,
     put it at the back.

     If it is 3/3, leave it out.
  */

  if (card.correct < 3) {

    day.queue.push(
      card.id
    );

  }


  /*
     Save the new score.
  */

  save();


  revealed = false;


  render();

};


/* =========================================================
   AGAIN
   ========================================================= */

document.getElementById(
  "again"
).onclick = function(event) {

  /*
     Stop this click from also
     triggering the card.
  */

  event.stopPropagation();


  if (isDayComplete()) {

    return;

  }


  const day =
    getDay();


  /*
     Get the current card ID.
  */

  const currentId =
    day.queue[0];


  if (
    currentId === undefined
  ) {

    return;

  }


  /*
     IMPORTANT:

     Get the actual card before
     changing its score.
  */

  const card =
    getCardById(currentId);


  if (!card) {

    return;

  }


  /*
     AGAIN ALWAYS RESETS THE SCORE TO ZERO.

     Examples:

     0/3 -> 0/3
     1/3 -> 0/3
     2/3 -> 0/3

     The learner must therefore get
     the word correct three fresh times.
  */

  card.correct = 0;


  /*
     Remove the card from the
     front of the queue.
  */

  day.queue.shift();


  /*
     Put the card at the BACK of
     the queue.

     It will appear again later.
  */

  day.queue.push(
    card.id
  );


  /*
     Save immediately so the
     zero score persists.
  */

  save();


  /*
     Hide the answer.
  */

  revealed = false;


  /*
     Show the next card.
  */

  render();

};


/* =========================================================
   RESET ONLY CURRENT DAY
   ========================================================= */

document.getElementById(
  "resetDay"
).onclick = function(event) {

  event.stopPropagation();


  const dayName =
    `Day ${currentDay + 1}`;


  const answer =
    confirm(
      `Reset ${dayName} only?\n\n` +
      `All scores for ${dayName} will be reset.\n\n` +
      `The other days will NOT be changed.`
    );


  if (!answer) {

    return;

  }


  /*
     Recreate ONLY the selected day.
  */

  createDay(currentDay);


  revealed = false;


  render();

};


/* =========================================================
   START
   ========================================================= */

ensureDay(currentDay);

save();

render();

</script>

</body>

</html>
